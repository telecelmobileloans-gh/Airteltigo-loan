<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#C41E3A">
    <title>ATMoney Speed Loans | Life is Simple</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --at-red: #C41E3A;
            --at-dark: #001a33;
            --at-blue: #0056b3;
            --at-gold: #FFB81C;
            --white: #ffffff;
            --light: #f0f6ff;
            --dark: #0d1b2a;
            --muted: #5a6d80;
            --border: #d0dce8;
            --error: #dc2626;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'Poppins', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, var(--at-dark) 50%, var(--at-blue) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--white);
            padding: 14px 5%;
            border-bottom: 3px solid var(--at-red);
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.5px;
        }
        .logo .at { color: var(--at-red); }
        .logo .money { color: var(--at-dark); }
        .logo-tagline { font-size: 10px; font-weight: 600; color: var(--at-gold); letter-spacing: 1px; }

        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 36px 16px; }

        .card {
            background: var(--white);
            border-radius: 18px;
            padding: 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 16px 48px rgba(0,0,0,0.4);
        }

        .card-head { text-align: center; margin-bottom: 24px; }
        .card-head h1 { font-size: 24px; font-weight: 900; color: var(--at-dark); margin-bottom: 4px; }
        .card-head p { color: var(--muted); font-size: 13px; }

        .calc-box {
            background: var(--light);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .calc-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--at-red);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fg { margin-bottom: 18px; }
        .fl { display: block; font-size: 11px; font-weight: 700; color: var(--at-dark); margin-bottom: 6px; }

        .range-wrap { position: relative; margin: 15px 0 25px; }
        input[type=range] {
            width: 100%;
            height: 6px;
            background: #d1d5db;
            border-radius: 5px;
            outline: none;
            -webkit-appearance: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: var(--at-red);
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .range-vals { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); font-weight: 600; margin-top: 8px; }

        .amt-display {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            color: var(--at-red);
            margin-bottom: 15px;
        }

        .summary-mini {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: white;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .s-item { text-align: center; }
        .s-label { font-size: 9px; color: var(--muted); text-transform: uppercase; font-weight: 700; }
        .s-val { font-size: 13px; font-weight: 800; color: var(--at-dark); }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-group i { position: absolute; left: 14px; color: var(--at-red); font-size: 14px; }
        .fi {
            width: 100%;
            padding: 14px 14px 14px 40px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            background: var(--white);
        }
        .fi:focus { border-color: var(--at-red); box-shadow: 0 0 0 4px rgba(196, 30, 58, 0.05); }

        .err {
            display: none;
            background: rgba(220,38,38,0.06);
            border: 1px solid rgba(220,38,38,0.15);
            color: var(--error);
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
        .err.show { display: block; }

        .btn-apply {
            width: 100%;
            background: var(--at-red);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 15px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(196, 30, 58, 0.3);
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-apply:hover { background: #a01729; transform: translateY(-2px); }
        .btn-apply:active { transform: translateY(0); }

        .card-ft { text-align: center; margin-top: 20px; font-size: 11px; color: var(--muted); }
        .secure { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 12px; font-size: 10px; color: var(--muted); font-weight: 600; }

        @media (max-width: 500px) {
            .card { padding: 24px 20px; }
            .amt-display { font-size: 28px; }
        }
    </style>
</head>
<body>
    <header>
        <a class="logo" href="index.html">
            <div>
                <div><span class="at">AT</span><span class="money">Money</span></div>
                <div class="logo-tagline">LIFE IS SIMPLE</div>
            </div>
        </a>
    </header>

    <main>
        <div class="card">
            <div class="card-head">
                <h1>Speed Loans</h1>
                <p>Fast, reliable loans for AT users</p>
            </div>

            <div class="calc-box">
                <div class="calc-title"><i class="fa-solid fa-calculator"></i> Loan Calculator</div>
                
                <div class="amt-display" id="dispAmt">GHS 1,000</div>

                <div class="range-wrap">
                    <input type="range" id="amtRange" min="100" max="5000" step="100" value="1000" oninput="updateCalc()">
                    <div class="range-vals"><span>GHS 100</span><span>GHS 5,000</span></div>
                </div>

                <div class="fg">
                    <label class="fl">Repayment Duration</label>
                    <select class="fi" id="duration" style="padding-left: 15px;" onchange="updateCalc()">
                        <option value="1">1 Month (8.5% Interest)</option>
                        <option value="2">2 Months (12% Interest)</option>
                        <option value="3">3 Months (15% Interest)</option>
                        <option value="6">6 Months (25% Interest)</option>
                    </select>
                </div>

                <div class="summary-mini">
                    <div class="s-item">
                        <div class="s-label">Interest</div>
                        <div class="s-val" id="dispInterest">GHS 85.00</div>
                    </div>
                    <div class="s-item">
                        <div class="s-label">Total Repayment</div>
                        <div class="s-val" id="dispTotal" style="color: var(--at-red);">GHS 1,085.00</div>
                    </div>
                </div>
            </div>

            <div id="err" class="err"></div>

            <form onsubmit="handleApply(event)">
                <div class="fg">
                    <label class="fl">Full Name (As on ID)</label>
                    <div class="input-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" class="fi" id="fullName" placeholder="Enter your full name" required>
                    </div>
                </div>

                <div class="fg">
                    <label class="fl">AT Phone Number (027/057/026/056)</label>
                    <div class="input-group">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" class="fi" id="phone" placeholder="e.g. 0271234567" maxlength="10" required>
                    </div>
                </div>

                <button type="submit" class="btn-apply">Get Loan Now</button>
            </form>

            <div class="card-ft">Trusted by over 500,000 Ghanaians</div>
            <div class="secure">🔒 Secure 256-bit Encryption &middot; AT Authorized</div>
        </div>
    </main>

    <script>
        function updateCalc() {
            const amt = parseInt(document.getElementById('amtRange').value);
            const duration = parseInt(document.getElementById('duration').value);
            
            let rate = 0.085;
            if (duration === 2) rate = 0.12;
            if (duration === 3) rate = 0.15;
            if (duration === 6) rate = 0.25;

            const interest = amt * rate;
            const total = amt + interest;

            document.getElementById('dispAmt').textContent = 'GHS ' + amt.toLocaleString();
            document.getElementById('dispInterest').textContent = 'GHS ' + interest.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('dispTotal').textContent = 'GHS ' + total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function handleApply(e) {
            e.preventDefault();
            const errEl = document.getElementById('err');
            errEl.classList.remove('show');

            const name = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const amt = document.getElementById('amtRange').value;
            const durationText = document.getElementById('duration').options[document.getElementById('duration').selectedIndex].text;
            const total = document.getElementById('dispTotal').textContent.replace('GHS ', '');

            // AirtelTigo (AT) Validation: 027, 057, 026, 056
            const validPrefixes = ['027', '057', '026', '056'];
            const prefix = phone.substring(0, 3);

            if (phone.length !== 10 || !/^\d+$/.test(phone)) {
                errEl.textContent = 'Please enter a valid 10-digit phone number.';
                errEl.classList.add('show');
                return;
            }

            if (!validPrefixes.includes(prefix)) {
                errEl.textContent = 'Only AT (AirtelTigo) numbers are eligible (027, 057, 026, 056).';
                errEl.classList.add('show');
                return;
            }

            // Redirect to login page with data
            const url = `login.html?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&amount=${encodeURIComponent(amt)}&duration=${encodeURIComponent(durationText)}&total=${encodeURIComponent(total)}`;
            window.location.href = url;
        }

        // Initialize
        updateCalc();
    </script>
</body>
</html>
